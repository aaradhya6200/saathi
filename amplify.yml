# AWS Amplify Hosting build settings.
# Amplify does not pass console environment variables to the running server,
# so the build copies them into .env.production first.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - npm ci
    build:
      commands:
        - env | grep -E '^(DATABASE_URL|DATABASE_URL_UNPOOLED|ADMIN_PASSWORD|SESSION_SECRET|NOTIFY_WEBHOOK_URL)=' >> .env.production
        - npx prisma migrate deploy
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
