<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#15803D">
<title>Saathi · You're offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F0F8F3; color: #0F2A1D;
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  .card { max-width: 360px; }
  .mark { width: 64px; height: 64px; border-radius: 18px; background: #15803D; margin: 0 auto 20px; display: grid; place-items: center; }
  h1 { font-size: 1.5rem; margin: 0 0 8px; }
  p { color: #4B6358; line-height: 1.5; margin: 0 0 20px; }
  button { background: #15803D; color: #fff; border: 0; border-radius: 999px; padding: 14px 28px; font-size: 1rem; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark"><svg viewBox="0 0 32 32" width="38" height="38"><path d="M6 22c3.5-1 4.5-11 10-11s4.5 7 10 4.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="6" cy="22" r="3" fill="#fff"/><circle cx="26" cy="15.5" r="3" fill="#fff"/></svg></div>
    <h1>No internet connection</h1>
    <p>Saathi needs the internet to book and track helpers. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
